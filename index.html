    <title>GIK339 - Labb 1</title>
    <script src="script.js" defer></script>

  <body>
    <!-- Reflektion uppgift 1 -->
    <!-- 
1. När jag placerar script-taggen i <head> ser jag till att min JavaScript-fil börjar laddas ner direkt samtidigt som webbläsaren läser in sidan.
2. Genom att lägga till attributet defer säger jag åt webbläsaren att vänta med att köra mitt script tills hela HTML-sidan har ritats upp helt och hållet. På så sätt undviker jag att min kod försöker leta efter eller ändra saker på webbsidan som inte har hunnit laddas in ännu.
-->
  </body>
